<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Center Stage Dance Academy</title>
    <style>
      :root {
        --black: #000000;
        --extra-dark-purple: #151120;
        --dark-purple: #3A3660;
        --light-purple: #CECBFD;
        --contrast: #E0DFC8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--black);
        color: var(--light-purple);
        font-family: 'Georgia', serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ── NAVBAR ── */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: transparent;
        transition: background 0.4s;
      }

      nav.scrolled {
        background: rgba(21, 17, 32, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .nav-logo {
        z-index: 200;
        display: flex;
        align-items: center;
      }

      .nav-logo img {
        height: 44px;
        width: auto;
        object-fit: contain;
        transition: opacity 0.3s;
      }

      /* ── HAMBURGER ── */
      .hamburger {
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 6px;
        z-index: 200;
      }

      .hamburger span {
        display: block;
        width: 28px;
        height: 1.5px;
        background: var(--light-purple);
        transition: all 0.4s cubic-bezier(.77,0,.175,1);
        transform-origin: center;
      }

      .hamburger.open span:nth-child(1) {
        transform: translateY(7.5px) rotate(45deg);
        background: var(--black);
      }
      .hamburger.open span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.open span:nth-child(3) {
        transform: translateY(-7.5px) rotate(-45deg);
        background: var(--black);
      }

      /* ── FULL SCREEN MENU — 3 panel wipe ── */
      .menu-overlay {
        position: fixed;
        inset: 0;
        z-index: 150;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 40px 40px;
        pointer-events: none;
        visibility: hidden;
      }

      .menu-overlay.open {
        pointer-events: all;
        visibility: visible;
      }

      .menu-panel {
        position: absolute;
        inset: 0;
        transform: translateX(100%);
        transition: transform 0.6s cubic-bezier(.77,0,.175,1);
      }

      .menu-panel-1 {
        background: var(--dark-purple);
        z-index: -3;
        transition-delay: 0s;
      }

      .menu-panel-2 {
        background: var(--extra-dark-purple);
        z-index: -2;
        transition-delay: 0.08s;
      }

      .menu-panel-3 {
        background: var(--light-purple);
        z-index: -1;
        transition-delay: 0.16s;
      }

      .menu-overlay.open .menu-panel {
        transform: translateX(0);
      }

      /* ── NAV LINKS ── */
      .menu-links {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .menu-links li {
        overflow: hidden;
      }

      .menu-links a {
        display: block;
        font-size: clamp(2.4rem, 10vw, 5rem);
        font-family: 'Georgia', serif;
        font-style: italic;
        color: var(--black);
        text-decoration: none;
        letter-spacing: -0.01em;
        line-height: 1.15;
        transform: translateY(110%);
        transition: transform 0.5s cubic-bezier(.77,0,.175,1), color 0.2s;
      }

      .menu-links a:hover {
        color: var(--dark-purple);
      }

      .menu-overlay.open .menu-links a {
        transform: translateY(0);
      }

      .menu-links li:nth-child(1) a { transition-delay: 0.28s; }
      .menu-links li:nth-child(2) a { transition-delay: 0.35s; }
      .menu-links li:nth-child(3) a { transition-delay: 0.42s; }
      .menu-links li:nth-child(4) a { transition-delay: 0.49s; }
      .menu-links li:nth-child(5) a { transition-delay: 0.56s; }

      .menu-footer {
        margin-top: auto;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--extra-dark-purple);
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s 0.6s;
      }

      .menu-overlay.open .menu-footer {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── HERO ── */
      .hero {
        height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 80px 28px 40px;
        position: relative;
        overflow: hidden;
        background: var(--black);
      }

      /* Lava lamp blobs */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(0px);
        mix-blend-mode: screen;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }

      .blob-1 {
        width: 45vw;
        height: 45vw;
        max-width: 340px;
        max-height: 340px;
        background: var(--dark-purple);
        top: 5%;
        left: -10%;
        animation: blobMove1 9s infinite alternate ease-in-out;
      }

      .blob-2 {
        width: 50vw;
        height: 50vw;
        max-width: 380px;
        max-height: 380px;
        background: var(--extra-dark-purple);
        bottom: 0%;
        right: -5%;
        animation: blobMove2 11s infinite alternate ease-in-out;
      }

      .blob-3 {
        width: 35vw;
        height: 35vw;
        max-width: 260px;
        max-height: 260px;
        background: var(--dark-purple);
        bottom: 20%;
        left: 10%;
        animation: blobMove3 7s infinite alternate ease-in-out;
      }

      .blob-4 {
        width: 28vw;
        height: 28vw;
        max-width: 200px;
        max-height: 200px;
        background: var(--light-purple);
        top: 15%;
        right: 5%;
        opacity: 0.18;
        animation: blobMove4 13s infinite alternate ease-in-out;
      }

      .blob-5 {
        width: 20vw;
        height: 20vw;
        max-width: 150px;
        max-height: 150px;
        background: var(--extra-dark-purple);
        top: 50%;
        left: 40%;
        animation: blobMove5 8s infinite alternate ease-in-out;
      }

      @keyframes blobMove1 {
        0%   { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(12vw, 8vh) scale(1.1); }
        66%  { transform: translate(5vw, 20vh) scale(0.95); }
        100% { transform: translate(15vw, 5vh) scale(1.05); }
      }

      @keyframes blobMove2 {
        0%   { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(-10vw, -10vh) scale(1.08); }
        66%  { transform: translate(-18vw, -5vh) scale(0.92); }
        100% { transform: translate(-8vw, -15vh) scale(1.1); }
      }

      @keyframes blobMove3 {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(15vw, -12vh) scale(1.15); }
        100% { transform: translate(8vw, -20vh) scale(0.9); }
      }

      @keyframes blobMove4 {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(-8vw, 15vh) scale(1.2); }
        100% { transform: translate(-15vw, 8vh) scale(0.85); }
      }

      @keyframes blobMove5 {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(-12vw, -10vh) scale(1.3); }
        100% { transform: translate(10vw, 12vh) scale(0.8); }
      }

      .hero-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .hero-logo {
        width: clamp(200px, 60vw, 380px);
        height: auto;
        opacity: 0;
        animation: fadeUp 1s 0.4s ease forwards;
      }

      .hero-sub {
        font-size: clamp(0.65rem, 2.5vw, 0.8rem);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--light-purple);
        opacity: 0;
        animation: fadeUp 1s 0.7s ease forwards;
      }

      .hero-cta {
        display: inline-block;
        margin-top: 8px;
        padding: 14px 36px;
        border: 1px solid var(--light-purple);
        color: var(--light-purple);
        text-decoration: none;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-family: 'Georgia', serif;
        transition: background 0.3s, color 0.3s;
        opacity: 0;
        animation: fadeUp 1s 0.9s ease forwards;
      }

      .hero-cta:hover {
        background: var(--light-purple);
        color: var(--black);
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── PLACEHOLDER ── */
      .placeholder {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dark-purple);
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>

    <!-- NAVBAR -->
    <nav id="navbar">
      <a href="index.html" class="nav-logo">
        <img src="logo.png" alt="Center Stage Dance Academy" />
      </a>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <!-- FULL SCREEN MENU -->
    <div class="menu-overlay" id="menuOverlay">
      <div class="menu-panel menu-panel-1"></div>
      <div class="menu-panel menu-panel-2"></div>
      <div class="menu-panel menu-panel-3"></div>
      <ul class="menu-links">
        <li><a href="#" onclick="closeMenu()">Home</a></li>
        <li><a href="#" onclick="closeMenu()">About</a></li>
        <li><a href="#" onclick="closeMenu()">Classes</a></li>
        <li><a href="#" onclick="closeMenu()">Handbook</a></li>
        <li><a href="#" onclick="closeMenu()">Contact</a></li>
      </ul>
      <div class="menu-footer">East Haven, CT &nbsp;·&nbsp; (203) 484-0443</div>
    </div>

    <!-- HERO -->
    <section class="hero">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
      <div class="blob blob-5"></div>
      <div class="hero-content">
        <img
          class="hero-logo"
          src="logo.png"
          alt="Center Stage Dance Academy"
        />
        <p class="hero-sub">Ballet · Tap · Jazz · Hip Hop · Lyrical · Acro</p>
        <a href="#" class="hero-cta">Explore Classes</a>
      </div>
    </section>

    <div class="placeholder">More content coming soon</div>

    <script>
      const hamburger = document.getElementById('hamburger');
      const menuOverlay = document.getElementById('menuOverlay');
      const navbar = document.getElementById('navbar');

      function openMenu() {
        hamburger.classList.add('open');
        menuOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        hamburger.classList.remove('open');
        menuOverlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      hamburger.addEventListener('click', () => {
        hamburger.classList.contains('open') ? closeMenu() : openMenu();
      });

      window.addEventListener('scroll', () => {
        navbar.classList.toggle('scrolled', window.scrollY > 40);
      });
    </script>

  </body>
</html>
